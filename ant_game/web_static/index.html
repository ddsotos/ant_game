<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>アリ進化ゲーム</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <header>
      <div><span class="eyebrow">5ラウンド試作版</span><h1>アリ進化ゲーム</h1></div>
      <button id="restart" class="quiet hidden">新しいゲーム</button>
    </header>

    <section id="setup" class="panel setup">
      <h2>ゲームを始める</h2>
      <p>災害の5ラウンド予報を見ながら、アリの進化列を組み立てます。</p>
      <label>再現用seed <input id="seed" type="number" value="42"></label>
      <label>環境災害 <select id="environment"><option value="">seedから決定</option></select></label>
      <button id="start" class="primary">開始</button>
    </section>

    <div id="game" class="hidden">
      <section id="overview" class="panel"></section>
      <div id="notice" role="status" aria-live="polite"></div>
      <section id="decision" class="panel"></section>
      <section id="board" class="panel"></section>
      <details id="adaptations" class="panel"><summary>この環境の切り札カード</summary><div id="extreme-list"></div></details>
    </div>
  </main>
  <script src="/app.js"></script>
</body>
</html>
